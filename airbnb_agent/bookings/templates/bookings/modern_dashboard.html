{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef3f4">
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% if site_settings.logo_display_url %}
      <meta name="mladis-logo-url" content="{{ site_settings.logo_display_url }}">
    {% endif %}
    <link rel="icon" href="{% static 'frontend/modern-dashboard/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'frontend/modern-dashboard/assets/app.css' %}?v=guests-selection-v1">
    <title>{% if page_title %}{{ page_title }} · MLADIS{% else %}MLADIS Command Center{% endif %}</title>
  </head>
  <body>
    <div id="root"></div>
    {{ ops_nav_public_items|json_script:"mladis-ops-nav-items" }}
    <script type="module" src="{% static 'frontend/modern-dashboard/assets/app.js' %}?v=guests-selection-v1"></script>
  </body>
</html>
