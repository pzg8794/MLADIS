{% load static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef3f4">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="available-languages" content="en,es">
    <meta name="application-name" content="MLADIS Modern Stays">
    {% if site_settings.logo_display_url %}
      <meta name="mladis-logo-url" content="{{ site_settings.logo_display_url }}">
    {% endif %}
    <link rel="icon" href="{% static 'frontend/modern-dashboard/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'frontend/modern-dashboard/assets/app.css' %}?v=mladis-functional-20260813-11">
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js" async></script>
    <title>MLADIS — Vacation Stays in Santo Domingo Norte</title>
  </head>
  <body>
    <div id="root"></div>
    {{ ops_nav_public_items|json_script:"mladis-ops-nav-items" }}
    <script type="module" src="{% static 'frontend/modern-dashboard/assets/app.js' %}?v=mladis-functional-20260813-11"></script>
  </body>
</html>
