{% load static %}<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% block title %}MLADIS Bookings{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'bookings/guest-resources.css' %}?v=4">
</head>
<body class="guest-resources">
  <header class="gr-header"><div class="gr-wrap gr-header-inner"><span class="gr-brand"><img src="{% static 'bookings/brand/mladis-bookings.jpg' %}" alt="" width="52" height="52" class="gr-logo"><span>MLADIS <small>Bookings</small></span></span>
    <nav class="gr-language-switch" aria-label="{{ copy.language_label }}">{% for option in language_options %}<a href="{{ option.url }}" lang="{{ option.code }}" hreflang="{{ option.code }}"{% if option.active %} aria-current="page"{% endif %}>{{ option.label }}</a>{% endfor %}</nav>
  </div></header>
  <main id="main" class="gr-wrap">{% block content %}{% endblock %}</main>
  <footer class="gr-footer"><div class="gr-wrap">MLADIS Bookings</div></footer>
</body>
</html>
