<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MLADIS Booking Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3eb;
        --panel: #fffdfa;
        --panel-strong: #ffffff;
        --text: #221f1a;
        --muted: #665f55;
        --line: #ded5c8;
        --accent: #176b63;
        --accent-dark: #0f4b45;
        --me: #e7f1ff;
        --bot: #eef6ea;
        --shadow: 0 18px 45px rgba(45, 35, 20, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(23, 107, 99, 0.09), transparent 34%),
          linear-gradient(315deg, rgba(157, 93, 52, 0.09), transparent 38%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(860px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      .shell {
        display: grid;
        gap: 24px;
      }

      header {
        display: grid;
        gap: 10px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 1.02;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 620px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .chat-panel {
        min-height: 520px;
        display: grid;
        grid-template-rows: 1fr auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 250, 0.88);
        box-shadow: var(--shadow);
      }

      #chat {
        min-height: 330px;
        max-height: 56vh;
        overflow-y: auto;
        padding: 22px;
      }

      .empty {
        height: 100%;
        display: grid;
        align-content: center;
        gap: 10px;
        color: var(--muted);
      }

      .msg {
        width: fit-content;
        max-width: min(620px, 88%);
        margin: 0 0 14px;
        padding: 12px 14px;
        border: 1px solid rgba(34, 31, 26, 0.08);
        border-radius: 8px;
        font-size: 0.98rem;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .msg.me {
        margin-left: auto;
        background: var(--me);
      }

      .msg.bot {
        background: var(--bot);
      }

      form {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-top: 1px solid var(--line);
        background: var(--panel-strong);
      }

      textarea {
        width: 100%;
        min-height: 112px;
        resize: vertical;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        color: var(--text);
        background: var(--panel);
        font: inherit;
        line-height: 1.45;
      }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(23, 107, 99, 0.14);
      }

      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .hint {
        color: var(--muted);
        font-size: 0.9rem;
      }

      button {
        min-width: 112px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:hover {
        background: var(--accent-dark);
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 860px);
          padding: 26px 0;
        }

        .chat-panel {
          min-height: 72vh;
        }

        #chat {
          padding: 14px;
        }

        .actions {
          align-items: stretch;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <header>
          <h1>MLADIS Booking Agent</h1>
          <p>
            A deployable first pass for the booking assistant. The API is live
            and ready for the real agent logic when we connect it.
          </p>
        </header>

        <section class="chat-panel" aria-label="Booking agent chat">
          <div id="chat">
            <div class="empty">
              <strong>Ask about booking, guest support, or property details.</strong>
              <span>The current backend is a safe stub until the agent brain is connected.</span>
            </div>
          </div>

          <form id="form">
            <textarea
              id="input"
              placeholder="Ask about booking..."
              aria-label="Message"
            ></textarea>
            <div class="actions">
              <span class="hint">Health check: <code>/healthz</code></span>
              <button type="submit">Send</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
